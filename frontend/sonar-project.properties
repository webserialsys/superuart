sonar.projectKey=superuart-frontend
sonar.projectName=SuperUART Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src/app,src/components,src/hooks,src/lib,src/providers,src/types
sonar.tests=src

sonar.exclusions=**/.next/**,**/node_modules/**,**/coverage/**,**/dist/**,**/*.lock,src/**/*.test.ts,src/**/*.test.tsx
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
