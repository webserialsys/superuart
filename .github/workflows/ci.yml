name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend unit tests
        run: bun run test

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    needs: 
      - backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build backend package
        run: python -m build

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    needs:
      - backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend unit tests
        run: bun run test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: 
      - frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build
