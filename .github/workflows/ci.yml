name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "sonar-project.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "sonar-project.properties"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_NAME: "Super UART"
      APP_VERSION: "0.1"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_ASYNC_PREFIX: postgresql+asyncpg://
      SECRET_KEY: ci-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_NAME: ci-admin
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Qwerty123!
      REDIS_CACHE_HOST: 127.0.0.1
      REDIS_CACHE_PORT: 6379
      REDIS_QUEUE_HOST: 127.0.0.1
      REDIS_QUEUE_PORT: 6379
      REDIS_RATE_LIMIT_HOST: 127.0.0.1
      REDIS_RATE_LIMIT_PORT: 6379
      CORS_ORIGINS: '["http://localhost:3000"]'
      CORS_METHODS: '["*"]'
      CORS_HEADERS: '["*"]'
      ENVIRONMENT: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Run backend unit tests with coverage
        run: uv run pytest tests --cov=src/app --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    needs:
      - backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build backend package
        run: python -m build

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend unit tests with coverage
        run: bun run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs:
      - frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      target_branch: ${{ steps.release.outputs.target_branch }}
    steps:
      - name: Resolve release metadata
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${COMMIT_SHA::7}"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "image_tag=sha-${SHORT_SHA}"
            echo "target_branch=${TARGET_BRANCH}"
          } >> "${GITHUB_OUTPUT}"

  publish-images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build
      - sonarqube
      - release-metadata
    if: (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: runner
            image: ghcr.io/${{ github.repository_owner }}/superuart/frontend
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            target: production
            image: ghcr.io/${{ github.repository_owner }}/superuart/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release-metadata.outputs.image_tag }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-k8s-manifests:
    name: Update Kubernetes manifests
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - publish-images
    if: needs.publish-images.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-metadata.outputs.target_branch }}

      - name: Update image tags in Kubernetes manifests
        env:
          IMAGE_TAG: ${{ needs.release-metadata.outputs.image_tag }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/superuart/backend:${{ needs.release-metadata.outputs.image_tag }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/superuart/frontend:${{ needs.release-metadata.outputs.image_tag }}
        run: |
          sed -i -E "s#image: ghcr\.io/[^/]+/superuart/backend:[^[:space:]]+#image: ${BACKEND_IMAGE}#g" k8s/deployment.yaml k8s/migrate.yaml
          sed -i -E "s#image: ghcr\.io/[^/]+/superuart/frontend:[^[:space:]]+#image: ${FRONTEND_IMAGE}#g" k8s/deployment.yaml

          git diff -- k8s/deployment.yaml k8s/migrate.yaml

          if git diff --quiet -- k8s/deployment.yaml k8s/migrate.yaml; then
            echo "Kubernetes manifests already use ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml k8s/migrate.yaml
          git commit -m "chore(gitops): deploy ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${{ needs.release-metadata.outputs.target_branch }}"

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
      - sonarqube
      - release-metadata
      - publish-images
      - update-k8s-manifests
    if: always()
    steps:
      - name: Send workflow status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failed' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'passed' }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured, skipping notification."
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA::7}"
          TEXT="SuperUART CI ${RESULT}%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}%0A${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${TEXT}"
