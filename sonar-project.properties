sonar.projectKey=superuart
sonar.projectName=SuperUART
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/app,frontend/src/app,frontend/src/components,frontend/src/hooks,frontend/src/lib,frontend/src/providers,frontend/src/types
sonar.tests=backend/tests,frontend/src

sonar.exclusions=**/__pycache__/**,**/.next/**,**/node_modules/**,**/coverage/**,**/dist/**,**/*.lock,backend/src/migrations/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.coverage.exclusions=backend/src/migrations/**,backend/src/app/core/db/models.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.d.ts

sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.qualitygate.wait=true
