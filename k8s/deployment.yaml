apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/webserialsys/superuart/backend:latest
          imagePullPolicy: Always
          args:
            - sh
            - -c
            - uv run --no-sync gunicorn src.app.main:app -w ${WEB_CONCURRENCY:-1} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
          env:
            - name: RUN_MIGRATIONS
              value: "0"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: superuart-config
            - secretRef:
                name: superuart-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/webserialsys/superuart/frontend:latest
          imagePullPolicy: Always
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: ""
          ports:
            - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/webserialsys/superuart/backend:latest
          imagePullPolicy: Always
          env:
            - name: RUN_MIGRATIONS
              value: "0"
          envFrom:
            - configMapRef:
                name: superuart-config
            - secretRef:
                name: superuart-secret
          command:
            - uv
            - run
            - --no-sync
            - arq
            - src.app.core.worker.settings.WorkerSettings
