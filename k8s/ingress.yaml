apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  labels:
    app.kubernetes.io/component: controller
spec:
  controller: ingress.alb.yc.io/yc-alb-ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superuart
  annotations:
    ingress.alb.yc.io/group-name: superuart
    ingress.alb.yc.io/external-ipv4-address: 81.26.190.20
    ingress.alb.yc.io/request-timeout: 3600s
    ingress.alb.yc.io/subnets: e9bt2ouvavk2oitfl3tu,fl8vs8n9mrtau5tp9vqc
    # ingress.alb.yc.io/security-groups: <SECURITY_GROUP_ID>
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
