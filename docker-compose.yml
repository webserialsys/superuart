services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - ./backend/src/.env
    environment:
      RUN_MIGRATIONS: "1"
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: arq app.core.worker.settings.WorkerSettings
    env_file:
      - ./backend/src/.env
    environment:
      RUN_MIGRATIONS: "0"
    depends_on:
      - backend
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - ./backend/src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
