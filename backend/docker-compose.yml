services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    # command: gunicorn src.app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - ./src/.env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/code/src
      - ./src/migrations:/code/migrations
      - ./src/alembic.ini:/code/alembic.ini
      - ./src/.env:/code/.env
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/api/v1/ready').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: arq src.app.core.worker.settings.WorkerSettings
    env_file:
      - ./src/.env
    environment:
      RUN_MIGRATIONS: "0"
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/code/src
      - ./src/.env:/code/.env

  db:
    image: postgres:16
    env_file:
      - ./src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - web

  #-------- uncomment to run tests --------
  pytest:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    env_file:
      - ./src/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m pytest ./tests
    volumes:
      - .:/code

volumes:
  postgres-data:
  redis-data:
